name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # release notes list the commits since the previous tag
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        # The same key for every build, so installed copies can update. Missing on forks
        # and pull requests: those builds fall back to the debug key, and tags fail below.
        env:
          KEYSTORE_B64: ${{ secrets.LUMEN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d "[:space:]" | base64 -d > "$RUNNER_TEMP/lumen.jks"
            echo "LUMEN_KEYSTORE=$RUNNER_TEMP/lumen.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Release builds need the LUMEN_KEYSTORE_B64 secret" >&2; exit 1
          fi
      - name: Build APK
        env:
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.LUMEN_KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.LUMEN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk lumen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-apk
          path: lumen.apk
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          {
            echo "## What's new"
            git log --no-merges --pretty='* %s' "$range" | grep -v '^\* Release [0-9]' || true
            echo
            echo "Install: download lumen.apk and the setup script for your computer, then see the README."
            echo "Already on a Fire TV with Lumen 0.11 or later: Lumen > Settings > Updates installs it."
          } > notes.md
          cat notes.md
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lumen.apk
            tools/setup.ps1
            tools/setup.sh
          body_path: notes.md
