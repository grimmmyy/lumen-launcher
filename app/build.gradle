plugins {
    id 'com.android.application'
}

// Release signing: every Lumen build must use the same key, or installed copies can't be
// updated. CI reads it from secrets (LUMEN_KEYSTORE etc.); locally from
// ~/.lumen/signing.properties. Without either (someone else building from source), the
// debug key is used.
def signing = new Properties()
if (System.getenv('LUMEN_KEYSTORE')) {
    signing.storeFile = System.getenv('LUMEN_KEYSTORE')
    signing.storePassword = System.getenv('LUMEN_KEYSTORE_PASSWORD')
    signing.keyAlias = System.getenv('LUMEN_KEY_ALIAS')
    signing.keyPassword = System.getenv('LUMEN_KEY_PASSWORD')
} else {
    def local = new File(System.getProperty('user.home'), '.lumen/signing.properties')
    if (local.isFile()) local.withInputStream { signing.load(it) }
}

android {
    namespace 'io.github.grimmmyy.lumen'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.grimmmyy.lumen'
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName '0.11.1'
    }

    signingConfigs {
        lumen {
            if (signing.storeFile) {
                storeFile file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signing.storeFile ? signingConfigs.lumen : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'
    // Applies baseline-prof.txt at install so the hot path is compiled, not interpreted.
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
}
